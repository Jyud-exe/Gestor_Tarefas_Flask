{% extends 'reprise.html' %}
{% block content %}
        <div style="display: flex;  align-items: center;  justify-content: space-between;">
            <h2 class="center">Atualizando Tarefa</h2>
            <a class="btn-sm btn btn-danger" href="{{url_for('home')}}">cancelar</a>
        </div>
        <HR></HR>
        <form action="" method="POST">
            <div class="row col-7">
                <h5 class="col-1">Tarefa:</h5><div class="col-2"> <input class="shadow form-control" type="text" name="titulo" value="{{ tarefa.tarefa }}" required></div>
                <h5 class="col-1">Hora:</h5><div class="col-2"> <input class="shadow form-control" type="text" name="horario" value="{{ tarefa.time }}" required></div>
                <button class="col-1 btn-sm btn btn-dark" type="submit"> Salvar</button>
            </div>
        </form>
{% endblock %}
