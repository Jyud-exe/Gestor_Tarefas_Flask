<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add tarefa</title>
    style>
        .container{
            width: 400px;
            margin: 0 auto;
        }
        label{
            display: block;
            margin-top: 10px;
        }
        input[type="text"]{
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button{
            margin-top: 15px;
            padding: 10px 20px;
        }
</head>
<body>
   <div class="container">
            <h2>ATUALIZAR TAREFAS</h2>
        <HR></HR>
        <div style="text-align: end;"><a style="text-align: end;" href="{{ url_for('home') }}"><button>voltar</button></a></div>
        <form action="" method="POST">
            <label for="titulo">Tarefa:</label>
            <input type="text" name="titulo" value="{{ tarefa.tarefa }}" required>

            <label for="horario">Horário:</label>
            <input type="text" name="horario" value="{{ tarefa.time }}" required>

            <button type="submit">Salvar</button>
        </form>
    </div>
</body>
</html>
