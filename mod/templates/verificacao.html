<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Verifique seu Email</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            max-width: 400px;
        }
        h1 {
            color: #007bff;
        }
        p {
            color: #555;
        }
        .icon {
            font-size: 50px;
            margin-bottom: 20px;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
        }
        a:hover {
            background-color: #0056b3;
        }
        .small {
            margin-top: 15px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📧</div>
        <h1>Verifique sua caixa de entrada</h1>
        <p>Enviamos um link de confirmação para o seu email.</p>
        <div class="small">
            Assim que confirmar, você será redirecionado automaticamente.
        </div>
        <script>
            setInterval(() => {
                fetch('/status_confirmacao')
                    .then(response => response.json())
                    .then(data => {
                        if (data.confirmado)
                        window.location.href = '/login'
                    })
            }, 3000)
        </script>
    </div>
</body>
</html>
